<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعاء اليوم</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
    .card {
            background: white;
            border-radius: 25px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
    .title {
            font-size: 32px;
            font-weight: 900;
            color: #667eea;
            margin-bottom: 10px;
        }
    .doaa {
            font-size: 22px;
            line-height: 2;
            color: #333;
            font-weight: 700;
            margin: 25px 0;
            padding: 25px;
            background: #f8f9ff;
            border-radius: 15px;
            border-right: 5px solid #667eea;
        }
    .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
        }
    .subscribe-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 15px;
            padding: 20px;
            margin-top: 25px;
        }
    .price {
            font-size: 28px;
            font-weight: 900;
            color: #ff6b00;
            margin: 10px 0;
        }
    .orange-cash {
            background: #ff6b00;
            color: white;
            padding: 12px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            margin: 15px 0;
            direction: ltr;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">🤲 دعاء اليوم</div>
        <div class="doaa" id="doaa">اللهم إني أسألك من الخير كله</div>
        <button class="btn" onclick="newDoaa()">دعاء جديد</button>
        
        <div class="subscribe-box">
            <div style="font-weight:700; font-size:18px;">✨ اشترك الآن</div>
            <div class="price">100 جنيه / شهرياً</div>
            <div style="color:#666;">للدفع أورانج كاش:</div>
            <div class="orange-cash">01289590022</div>
            <div style="font-size:14px;">حول المبلغ وارسل سكرين شوت واتساب</div>
        </div>
    </div>

    <script>
        const ad3ya = [
            "اللهم إني أسألك من الخير كله عاجله وآجله",
            "اللهم اجعلني من التوابين واجعلني من المتطهرين", 
            "ربنا آتنا في الدنيا حسنة وفي الآخرة حسنة",
            "اللهم إني أسألك الهدى والتقى والعفاف والغنى",
            "يا حي يا قيوم برحمتك أستغيث أصلح لي شأني كله"
        ];
        function newDoaa() {
            const random = Math.floor(Math.random() * ad3ya.length);
            document.getElementById('doaa').textContent = ad3ya[random];
        }
    </script>
</body>
</html>
